##
## BitBake post-config fragment — CycloneDX SBOM/VEX generation
##
## Passed to bitbake via -R when --sbom=yes or --release=yes.
## meta-cyclonedx does not inherit cyclonedx-export globally via
## layer.conf, so this explicit INHERIT is required.
##

INHERIT += "cyclonedx-export"

# Workaround: meta-cyclonedx does not include CYCLONEDX_EXPORT_SBOM/VEX in
# do_deploy_cyclonedx[vardeps], so sstate hits survive filename changes.
# Add them here so a changed export path invalidates the sstate entry.
do_deploy_cyclonedx[vardeps] += "CYCLONEDX_EXPORT_SBOM CYCLONEDX_EXPORT_VEX"
